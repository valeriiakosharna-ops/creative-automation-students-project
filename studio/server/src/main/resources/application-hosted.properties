# A hosted instance always requires each visitor's own key for every AI request.
# Never fall back to an owner's shared key on a public endpoint.
creative.openai.client-keys-enabled=true
creative.openai.api-key=
creative.allowed-origins=
server.address=${STUDIO_BIND_ADDRESS:0.0.0.0}
server.forward-headers-strategy=framework
spring.config.import=
