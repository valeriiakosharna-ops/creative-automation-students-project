spring.config.import=
creative.corporate.enabled=true
creative.openai.client-keys-enabled=false
creative.allowed-origins=
server.address=${STUDIO_BIND_ADDRESS:0.0.0.0}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
creative.corporate.domain=${STUDIO_EMAIL_DOMAIN:}
creative.corporate.owner-email=${STUDIO_OWNER_EMAIL:}
creative.corporate.client-id=${GOOGLE_CLIENT_ID:}
creative.corporate.client-secret=${GOOGLE_CLIENT_SECRET:}
creative.corporate.public-url=${STUDIO_PUBLIC_URL:}
creative.workspace.directory=${STUDIO_DATA_DIR:/var/lib/creative-studio}
creative.workspace.key=${STUDIO_STORAGE_KEY:}
creative.workspace.quota-bytes=${STUDIO_STORAGE_QUOTA_BYTES:5368709120}
creative.corporate.daily-user-attempts=${STUDIO_DAILY_USER_ATTEMPTS:20}
creative.corporate.daily-team-attempts=${STUDIO_DAILY_TEAM_ATTEMPTS:100}
spring.mvc.log-request-details=false
server.tomcat.accesslog.enabled=false
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
