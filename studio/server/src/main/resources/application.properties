spring.application.name=creative-automation-studio
spring.config.import=optional:file:./application-local.properties
server.address=${STUDIO_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
creative.openai.api-key=${CREATIVE_OPENAI_API_KEY:}
creative.openai.model=${CREATIVE_OPENAI_MODEL:gpt-4.1-mini}
creative.openai.base-url=https://api.openai.com/v1
creative.allowed-origins=${STUDIO_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}
spring.jackson.deserialization.fail-on-unknown-properties=false
