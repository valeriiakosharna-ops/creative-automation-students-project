name: Hosted Studio container
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: studio-ci:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the complete hosted container without an API key
        run: |
          docker run -d --name studio-smoke -p 127.0.0.1:18080:8080 studio-ci:${{ github.sha }}
          python3 scripts/check_hosted.py http://127.0.0.1:18080
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          studio_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag studio-ci:${{ github.sha }} "$studio_image:${{ github.sha }}"
          docker tag studio-ci:${{ github.sha }} "$studio_image:latest"
          docker push "$studio_image:${{ github.sha }}"
          docker push "$studio_image:latest"
      - name: Show container diagnostics on failure
        if: failure()
        run: docker logs studio-smoke || true
      - name: Remove test container
        if: always()
        run: docker rm -f studio-smoke || true
