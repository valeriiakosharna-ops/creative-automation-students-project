name: Build and deploy project site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Validate site
        run: |
          node --check script.js
          python3 scripts/check_site.py
      - name: Build Studio MVP
        env:
          STUDIO_FIREBASE_PROJECT_ID: ${{ vars.STUDIO_FIREBASE_PROJECT_ID }}
          STUDIO_FIREBASE_API_KEY: ${{ vars.STUDIO_FIREBASE_API_KEY }}
        run: |
          npm ci --prefix studio
          npm --prefix studio test
          npm --prefix studio run build:pages
      - name: Build static site
        run: |
          mkdir -p _site
          cp index.html styles.css script.js _site/
          cp -R assets _site/assets
          cp -R docs _site/docs
          mkdir -p _site/studio
          cp -R studio/dist/. _site/studio/
          cp -R style-guide _site/style-guide
          cp studio/QUICKSTART.md _site/studio/QUICKSTART.md
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
